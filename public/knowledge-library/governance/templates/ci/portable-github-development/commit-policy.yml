name: Commit policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  commits:
    name: Commit subjects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate commit subjects
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            range="origin/${{ github.event.pull_request.base.ref }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          pattern='^(feat|fix|docs|refactor|test|chore|ci|build|perf|style)(\([a-z0-9-]+\))?: #[1-9][0-9]* [a-z][a-z0-9-]*( .*)?$'
          failed=0
          while IFS= read -r subject; do
            [[ -z "$subject" ]] && continue
            if [[ ! "$subject" =~ $pattern ]] && [[ ! "$subject" =~ ^Merge\  ]]; then
              echo "Invalid commit subject: $subject"
              failed=1
            fi
          done < <(git log --format=%s "$range")
          exit "$failed"
