name: Project sync (optional)

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue or pull request number to add to the configured Project
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  add-to-project:
    name: Add item to GitHub Project
    runs-on: ubuntu-latest
    steps:
      - name: Add issue or pull request to Project
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          ITEM_NUMBER: ${{ inputs.issue_number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PROJECT_ID" ]]; then echo 'Repository variable PROJECT_ID is required.' >&2; exit 1; fi
          if [[ -z "$GH_TOKEN" ]]; then echo 'Repository secret PROJECTS_TOKEN is required.' >&2; exit 1; fi
          item_id=$(gh api graphql -f query='query($owner:String!, $name:String!, $number:Int!) { repository(owner:$owner,name:$name) { issueOrPullRequest(number:$number) { id } } }' -f owner="${REPOSITORY%/*}" -f name="${REPOSITORY#*/}" -F number="$ITEM_NUMBER" --jq '.data.repository.issueOrPullRequest.id')
          gh api graphql -f query='mutation($project:ID!, $content:ID!) { addProjectV2ItemById(input:{projectId:$project,contentId:$content}) { item { id } } }' -f project="$PROJECT_ID" -f content="$item_id" >/dev/null
          echo "Added #$ITEM_NUMBER to the configured GitHub Project."
