<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
<title id="title">75 Days of Discipline Shortcut and Notion architecture</title>
<desc id="desc">The 75 Days of Discipline workflow moves from Shortcut prompts and date context through Log Discipline, a structured response dictionary, a Notion API request, the discipline database and Goal Tracker relation, then into a Notion Chart for progress review.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#66736a"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="135%"><feDropShadow dx="2" dy="3" stdDeviation="1.5" flood-color="#1e2823" flood-opacity=".18"/></filter>
  <style>
    text{font-family:'Avenir Next',Avenir,'Segoe UI',Arial,sans-serif;fill:#1e2823}.layer{stroke:#bdc8b8;stroke-width:2}.layerhead{font-size:21px;font-weight:700}.card{fill:#fffef8;stroke:#b7c5b4;stroke-width:1.5}.carddark{fill:#25382e;stroke:#506552;stroke-width:1.5}.cardgreen{fill:#e4ebdf;stroke:#aebda9;stroke-width:1.5}.cardgold{fill:#f0e3c9;stroke:#d0aa67;stroke-width:1.5}.cardteal{fill:#dfebe6;stroke:#7aa6a0;stroke-width:1.5}.head{font-size:17px;font-weight:700}.sub{font-size:13px;fill:#53635a}.light{fill:#f7f5eb}.lightSub{fill:#d3dfd1}.arrow{fill:none;stroke:#66736a;stroke-width:2;marker-end:url(#arrow)}.flowtitle{font-size:17px;font-weight:700}.flowtext{font-size:12.5px;fill:#425249}.tiny{font-size:11.5px;fill:#53635a}
  </style>
</defs>
