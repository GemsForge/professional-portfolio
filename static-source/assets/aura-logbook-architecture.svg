<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" role="img" aria-labelledby="title description">
  <title id="title">Aura Logbook mobile-first application architecture</title>
  <desc id="description">A responsive React web client and a React Native Expo shell connect to a .NET 9 API. Dapper repositories persist user and journal data in SQLite with versioned SQL migrations. The API also connects to private photo storage and Open-Meteo weather.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f6ee"/><stop offset="1" stop-color="#e9eee5"/></linearGradient>
    <linearGradient id="forest" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#335943"/><stop offset="1" stop-color="#203c2b"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e2823" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#66846a"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#1e2823}
      .title{font-family:Georgia,'Times New Roman',serif;font-size:34px;font-weight:700;letter-spacing:-.4px}
      .subtitle{font-size:16px;fill:#536158}
      .panel{fill:#f9f8f2;stroke:#c9d3c6;stroke-width:1.5}
      .panel-head{font-size:13px;font-weight:700;letter-spacing:1.8px;fill:#527257}
      .card{fill:#fffefa;stroke:#d4d9cd;stroke-width:1.2}
      .card-title{font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:700}
      .card-sub{font-size:14px;fill:#536158}
      .label{font-size:13px;font-weight:700;fill:#426148}
      .body{font-size:15px;fill:#29362d}
      .tiny{font-size:12px;fill:#536158}
      .chip{fill:#e8eee4;stroke:#c5d1c0}
      .chip-text{font-size:12px;font-weight:700;fill:#355a3a}
      .accent{fill:#d6b46b}
      .light{fill:#f4f1e6}
      .flow-title{font-family:Georgia,'Times New Roman',serif;font-size:21px;font-weight:700}
      .flow-body{font-size:14px;fill:#536158}
      .number{font-size:14px;font-weight:700;fill:#fffefa}
    </style>
  </defs>
  <rect width="1800" height="1000" fill="url(#paper)"/>
  <circle cx="1660" cy="64" r="170" fill="#dfe9dc" opacity=".35"/>
  <text class="title" x="60" y="62">Mobile-first clients, one reflective journal</text>
  <text class="subtitle" x="62" y="94">Current product layers and the persistence work already in place</text>

  <!-- Client surfaces -->
  <rect class="panel" x="60" y="130" width="460" height="530" rx="22"/>
  <text class="panel-head" x="88" y="170">01 · CLIENTS</text>
  <rect class="card" x="86" y="193" width="408" height="245" rx="16" filter="url(#shadow)"/>
  <text class="card-title" x="112" y="232">Responsive web client</text>
  <text class="card-sub" x="112" y="258">React · TypeScript · Vite</text>
  <text class="label" x="112" y="294">PHONE FIRST, DESKTOP READY</text>
  <rect class="chip" x="112" y="310" width="78" height="30" rx="15"/><text class="chip-text" x="132" y="330">Sign in</text>
  <rect class="chip" x="198" y="310" width="78" height="30" rx="15"/><text class="chip-text" x="221" y="330">Today</text>
  <rect class="chip" x="284" y="310" width="96" height="30" rx="15"/><text class="chip-text" x="301" y="330">Check-in</text>
  <rect class="chip" x="112" y="350" width="100" height="30" rx="15"/><text class="chip-text" x="132" y="370">Journal</text>
  <rect class="chip" x="220" y="350" width="96" height="30" rx="15"/><text class="chip-text" x="242" y="370">Insights</text>
  <text class="tiny" x="112" y="413">The screenshots pair a phone layout with its desktop view.</text>
  <rect class="card" x="86" y="456" width="408" height="176" rx="16" filter="url(#shadow)"/>
  <text class="card-title" x="112" y="496">Native shell</text>
  <text class="card-sub" x="112" y="521">React Native · Expo Router</text>
  <text class="body" x="112" y="552">Today · Log · Journal · Profile</text>
  <text class="tiny" x="112" y="582">Native authentication, API connection, and device QA</text>
  <text class="tiny" x="112" y="601">remain in progress.</text>

  <!-- API layer -->
  <rect class="panel" x="590" y="130" width="550" height="530" rx="22"/>
  <text class="panel-head" x="618" y="170">02 · APPLICATION API</text>
  <rect x="618" y="193" width="494" height="72" rx="15" fill="url(#forest)"/>
  <text x="644" y="225" font-size="20" font-weight="700" fill="#fffefa">ASP.NET Core · .NET 9</text>
  <text x="644" y="247" font-size="13" fill="#e3ebdf">JWT authentication · user-scoped routes</text>
  <rect class="card" x="618" y="284" width="235" height="142" rx="15"/>
  <text class="card-title" x="640" y="322" font-size="19">Mood journal</text>
  <text class="body" x="640" y="350">Entries · selected moods</text>
  <text class="body" x="640" y="375">Reflection · edit · history</text>
  <text class="tiny" x="640" y="404">Controller → service → repository</text>
  <rect class="card" x="877" y="284" width="235" height="142" rx="15"/>
  <text class="card-title" x="899" y="322" font-size="19">Personalization</text>
  <text class="body" x="899" y="350">Pathways · prompts · insights</text>
  <text class="body" x="899" y="375">Aura colors · reference data</text>
  <text class="tiny" x="899" y="404">Definitions served from the API</text>
  <rect class="card" x="618" y="445" width="235" height="168" rx="15"/>
  <text class="card-title" x="640" y="484" font-size="19">Private photo flow</text>
  <text class="body" x="640" y="512">Owner-scoped attachments</text>
  <text class="body" x="640" y="537">Metadata follows its entry</text>
  <text class="tiny" x="640" y="579">Gallery filters · swipe lightbox</text>
  <rect class="card" x="877" y="445" width="235" height="168" rx="15"/>
  <text class="card-title" x="899" y="484" font-size="19">External context</text>
  <text class="body" x="899" y="512">Open-Meteo weather</text>
  <text class="body" x="899" y="537">Spotify integrations</text>
  <text class="tiny" x="899" y="579">Optional context for the journal</text>

  <!-- Relational persistence -->
  <rect class="panel" x="1230" y="130" width="510" height="530" rx="22"/>
  <text class="panel-head" x="1258" y="170">03 · RELATIONAL PERSISTENCE</text>
  <rect x="1258" y="193" width="454" height="111" rx="17" fill="url(#forest)" filter="url(#shadow)"/>
  <text x="1284" y="238" font-family="Georgia,serif" font-size="27" font-weight="700" fill="#fffefa">SQLite</text>
  <text x="1284" y="267" font-size="15" fill="#e3ebdf">Dapper repositories · implemented</text>
  <rect class="accent" x="1647" y="216" width="37" height="7" rx="3.5"/>
  <rect class="accent" x="1647" y="233" width="37" height="7" rx="3.5" opacity=".7"/>
  <rect class="accent" x="1647" y="250" width="37" height="7" rx="3.5" opacity=".45"/>
  <text class="label" x="1258" y="342">VERSIONED SQL MIGRATIONS</text>
  <rect class="card" x="1258" y="360" width="454" height="230" rx="15"/>
  <text class="body" x="1284" y="400">Users and profile preferences</text>
  <line x1="1284" y1="417" x2="1685" y2="417" stroke="#d9ddcf"/>
  <text class="body" x="1284" y="449">Mood entries and selected mood rows</text>
  <line x1="1284" y1="466" x2="1685" y2="466" stroke="#d9ddcf"/>
  <text class="body" x="1284" y="498">Pathways, moods, colors, prompts</text>
  <line x1="1284" y1="515" x2="1685" y2="515" stroke="#d9ddcf"/>
  <text class="body" x="1284" y="547">Reflection and private media metadata</text>
  <text class="tiny" x="1258" y="625">Development and FIT/Staging environments</text>

  <!-- Request and storage flow -->
  <path d="M520 388h56" fill="none" stroke="#66846a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1140 388h78" fill="none" stroke="#66846a" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Example user journey -->
  <rect x="60" y="700" width="1680" height="225" rx="22" fill="#edf0e7" stroke="#c9d3c6" stroke-width="1.5"/>
  <text class="panel-head" x="90" y="741">A USER-LED JOURNEY</text>
  <rect class="card" x="90" y="770" width="490" height="115" rx="16"/>
  <circle cx="124" cy="808" r="17" fill="#496c4e"/><text class="number" x="120" y="813">1</text>
  <text class="flow-title" x="155" y="812">Choose a pathway</text>
  <text class="flow-body" x="155" y="840">Prompts and context follow the user’s selected perspective.</text>
  <path d="M592 827h54" stroke="#66846a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect class="card" x="660" y="770" width="490" height="115" rx="16"/>
  <circle cx="694" cy="808" r="17" fill="#496c4e"/><text class="number" x="690" y="813">2</text>
  <text class="flow-title" x="725" y="812">Save a check-in</text>
  <text class="flow-body" x="725" y="840">A mood entry and its selected moods persist in SQLite.</text>
  <path d="M1162 827h54" stroke="#66846a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect class="card" x="1230" y="770" width="480" height="115" rx="16"/>
  <circle cx="1264" cy="808" r="17" fill="#496c4e"/><text class="number" x="1260" y="813">3</text>
  <text class="flow-title" x="1295" y="812">Reflect and revisit</text>
  <text class="flow-body" x="1295" y="840">Return to entries, photos, and insight views over time.</text>
  <text class="tiny" x="90" y="907">Aura colors and pathway interpretations are optional personal reflection—not medical assessment.</text>
</svg>
