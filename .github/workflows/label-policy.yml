name: Label policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  require-label:
    name: Required workflow label
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require a workflow label
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              ...context.repo, pull_number: context.payload.pull_request.number,
            });
            const labels = pullRequest.labels.map(({ name }) => name);
            const allowed = ['feature', 'bug', 'documentation', 'maintenance', 'dependencies', 'security', 'refactor', 'testing', 'ci'];
            if (!labels.some((label) => allowed.includes(label))) {
              core.setFailed(`Add one workflow label: ${allowed.join(', ')}.`);
            }
