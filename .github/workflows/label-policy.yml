name: Label policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  label-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate title and required label
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              ...context.repo, pull_number: context.payload.pull_request.number,
            });
            const match = /^(feat|fix|refactor|test|docs|chore)\(([a-z0-9-]+)\): #([1-9][0-9]*) ([a-z][a-z0-9-]*(?:\s+\S.*)?)$/.exec(pullRequest.title || "");
            if (!match) {
              core.setFailed('PR title must match type(scope): #issue short imperative description.');
              return;
            }
            const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: Number(match[3]) });
            const expectedTitle = issue.title;
            if (pullRequest.title !== expectedTitle) {
              core.setFailed("PR title must match issue #" + match[3] + " title: \"" + expectedTitle + "\".");
              return;
            }
            const labels = pullRequest.labels.map(({ name }) => name);
            const required = { feat: 'feature', fix: 'fix', refactor: 'refactor', test: 'testing', docs: 'documentation', chore: 'chore' }[match[1]];
            if (!labels.includes(required)) {
              core.setFailed(`Missing required label: ${required}.`);
            }
