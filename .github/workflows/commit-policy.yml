name: Commit policy

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git log --format='%s' "$BASE_SHA..$HEAD_SHA" | while IFS= read -r subject; do
            if ! printf '%s\n' "$subject" | grep -Eq '^(feat|fix|docs|refactor|test|chore|ci|build|perf|style)(\([a-z0-9._/-]+\))?!?: .+'; then
              echo "Invalid commit subject: $subject"
              exit 1
            fi
          done
