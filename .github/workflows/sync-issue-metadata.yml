name: Sync issue and pull request metadata

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened, edited, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to synchronize
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Copy working issue metadata to the pull request
        uses: actions/github-script@v7
        env:
          MANUAL_PR: ${{ inputs.pr_number || '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const manual = Number(process.env.MANUAL_PR) || undefined;
            const pr = context.payload.pull_request || (manual
              ? (await github.rest.pulls.get({ ...context.repo, pull_number: manual })).data
              : null);
            const branchIssue = (ref) => Number(ref?.match(/^(?:feat|fix|docs|refactor|test|chore|ci|build|perf|style)\/(\d+)(?:-|$)/i)?.[1]) || undefined;
            const referencedIssue = (text) => Number(text?.match(/(?:^|\s)#(\d+)\b/)?.[1]) || undefined;
            const issueNumber = context.payload.issue?.number
              || branchIssue(pr?.head.ref)
              || referencedIssue(pr?.title)
              || referencedIssue(pr?.body);
            if (!issueNumber) throw new Error('No issue number found in the event or branch name.');
            const issue = (await github.rest.issues.get({ ...context.repo, issue_number: issueNumber })).data;
            if (issue.pull_request) throw new Error('The linked item must be an issue, not a pull request.');
            if (!pr) {
              core.notice(`Issue #${issueNumber} opened; metadata will be copied when its PR opens.`);
              return;
            }
            await github.rest.issues.setLabels({
              ...context.repo, issue_number: pr.number,
              labels: issue.labels.map((label) => typeof label === 'string' ? label : label.name),
            });
            const desiredAssignees = issue.assignees.map(({ login }) => login);
            const currentAssignees = pr.assignees.map(({ login }) => login);
            const stale = currentAssignees.filter((login) => !desiredAssignees.includes(login));
            const added = desiredAssignees.filter((login) => !currentAssignees.includes(login));
            if (stale.length) await github.rest.issues.removeAssignees({ ...context.repo, issue_number: pr.number, assignees: stale });
            if (added.length) await github.rest.issues.addAssignees({ ...context.repo, issue_number: pr.number, assignees: added });
            await github.rest.issues.update({
              ...context.repo, issue_number: pr.number,
              milestone: issue.milestone?.number ?? null,
            });
            core.notice(`Synchronized PR #${pr.number} from issue #${issueNumber}.`);
